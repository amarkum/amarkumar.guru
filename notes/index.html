<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Notes | amarkumar.guru</title>
  <meta name="description" content="Detailed notes for 26 Amazon LLD and HLD interview questions, with diagrams, patterns and Java code.">
  <script>(function(){try{var t=localStorage.getItem("sc-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <script>
window.mmInit=function(){var a=document.documentElement.getAttribute("data-theme"),d=a?a==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({startOnLoad:false,securityLevel:"loose",theme:"base",fontFamily:"DM Sans, system-ui, sans-serif",flowchart:{htmlLabels:true,curve:"basis"},
themeVariables:d?{background:"#0a0a0a",primaryColor:"#1f1f1f",primaryTextColor:"#f2f2f2",primaryBorderColor:"#5a5a5a",lineColor:"#8a8a8a",secondaryColor:"#1a1a1a",tertiaryColor:"#141414",noteBkgColor:"#262626",noteTextColor:"#f2f2f2",actorBkg:"#1f1f1f",actorTextColor:"#f2f2f2",actorBorder:"#5a5a5a",signalColor:"#c8c8c8",signalTextColor:"#f2f2f2",labelBoxBkgColor:"#1f1f1f",labelTextColor:"#f2f2f2",edgeLabelBackground:"#141414",clusterBkg:"#141414",clusterBorder:"#3a3a3a",fontSize:"14px"}
:{background:"#f7f7f7",primaryColor:"#ffffff",primaryTextColor:"#1a1a1a",primaryBorderColor:"#1a1a1a",lineColor:"#6b6b6b",secondaryColor:"#f1f1f1",tertiaryColor:"#fafafa",noteBkgColor:"#fffbeb",noteTextColor:"#1a1a1a",actorBkg:"#ffffff",actorTextColor:"#1a1a1a",actorBorder:"#1a1a1a",signalColor:"#404040",signalTextColor:"#1a1a1a",labelBoxBkgColor:"#ffffff",labelTextColor:"#1a1a1a",edgeLabelBackground:"#f7f7f7",clusterBkg:"#fafafa",clusterBorder:"#d4d4d4",fontSize:"14px"}})};
window.mmInit();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>
<body>
<header class="site-head"><div class="in">
  <a class="brand" href="/">amarkumar<span>.guru</span></a>
  <nav class="site-nav" aria-label="Site">
    <a href="/">Course</a>
    <a href="/plan/">2-Day Plan</a>
    <a href="/notes/" aria-current="page">Notes</a>
    <a href="/guide/">Guide</a>
    <a href="/interviewer/">Interviewer</a>
    <a href="/practice/">Practice</a>
    <a href="https://excalidraw.com" target="_blank" rel="noopener">Whiteboard ↗</a>
    <button id="themebtn" class="themebtn" type="button">Dark mode</button>
  </nav>
</div></header>
<div class="layout">
  <aside class="side">
    <div><h2>Design notes</h2><p class="sub">Full write-ups for each question: requirements, class diagram, patterns, Java code and follow-ups.</p></div>
    <input id="nq" class="nsearch" type="search" placeholder="Filter notes…" aria-label="Filter notes">
    <nav id="nlist" class="nlist" aria-label="Notes"></nav>
  </aside>
  <div class="content">
    <div class="crumbs"><a href="/notes/">Notes</a> <span id="ncrumb"></span></div>
    <article id="doc" class="card md">Loading…</article>
    <div class="foot" id="npager"></div>
  </div>
</div>
<footer class="site-foot">© <span id="yr"></span> amarkumar.guru</footer>
<script>

require.config({paths:{vs:"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs"}});
let monacoP=new Promise(res=>require(["vs/editor/editor.main"],res));
const LANGMAP={js:"javascript",ts:"typescript",py:"python",sh:"shell",bash:"shell",yml:"yaml",md:"markdown"};
const BASE="/system-design/lld/";let LIST=[];
function slugOf(f){return f.replace(/\.md$/,"")}
async function loadList(){const t=await (await fetch(BASE+"README.md",{cache:"no-cache"})).text();
 const re=/\|\s*(\d+)\s*\|\s*\[([^\]]+)\]\(([^)]+\.md)\)\s*\|\s*([^|]*)\|/g;let m;LIST=[];
 while((m=re.exec(t)))LIST.push({n:m[1],t:m[2],f:m[3],k:m[4].trim()});drawList()}
function drawList(){const q=(nq.value||"").toLowerCase(),cur=location.hash.slice(1);
 nlist.innerHTML=`<a href="#" class="${!cur?"on":""}"><span class="num">·</span>Overview</a>`+LIST.filter(x=>!q||x.t.toLowerCase().includes(q)).map(x=>`<a href="#${slugOf(x.f)}" class="${cur===slugOf(x.f)?"on":""}"><span class="num">${x.n}</span>${x.t}</a>`).join("")}
nq.oninput=drawList;
let rn=0;
async function show(){const cur=location.hash.slice(1);const file=cur?cur+".md":"README.md";
 doc.innerHTML="Loading…";let md;
 try{const r=await fetch(BASE+file,{cache:"no-cache"});if(!r.ok)throw 0;md=await r.text()}catch(e){doc.innerHTML="<p>Couldn't load this note. Check your connection and try again.</p>";return}
 doc.innerHTML=marked.parse(md);
 doc.querySelectorAll("a[href$='.md']").forEach(a=>{const h=a.getAttribute("href");if(!/^https?:/.test(h))a.setAttribute("href","#"+h.split("/").pop().replace(/\.md$/,""))});
 doc.querySelectorAll("table").forEach(t=>{const w=document.createElement("div");w.className="tbl";t.parentNode.insertBefore(w,t);w.appendChild(t)});
 for(const c of doc.querySelectorAll("pre code.language-mermaid")){const pre=c.parentNode,src=c.textContent,box=document.createElement("div");box.className="diagram";pre.replaceWith(box);
  try{const r=await mermaid.render("nm"+(rn++),src);box.innerHTML=r.svg;
   box.querySelectorAll("g.node").forEach(g=>{const k=(g.textContent.match(/«(\w+)»/)||[])[1];if(k)g.setAttribute("data-kind",k)})}catch(e){box.innerHTML="<pre>"+src.replace(/</g,"&lt;")+"</pre>"}}
 await renderCode(doc);
 const i=LIST.findIndex(x=>slugOf(x.f)===cur);const it=LIST[i];
 ncrumb.textContent=it?"/ "+it.t:"";document.title=(it?it.t+" | ":"")+"Notes | amarkumar.guru";
 const pv=i>0?LIST[i-1]:null,nx=i<LIST.length-1?LIST[i+1]:null;
 npager.innerHTML=(pv?`<a class="pbtn" href="#${slugOf(pv.f)}">← ${pv.t}</a>`:"<span></span>")+(nx?`<a class="pbtn primary" href="#${slugOf(nx.f)}">${nx.t} →</a>`:"");
 drawList();scrollTo(0,0)}
const API_RE=/^(GET|POST|PUT|PATCH|DELETE|HEAD|WS)\s+(\S+)\s*(.*)$/;
const esc=s=>s.replace(/[&<>]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[ch]));
function apiCard(ls){const box=document.createElement("div");box.className="api";
 box.innerHTML=ls.map(l=>{const t=l.trim(),m=t.match(API_RE);
  if(m)return `<div class="api-row"><span class="verb v-${m[1].toLowerCase()}">${m[1]}</span><code class="path">${esc(m[2]).replace(/\{([^}]+)\}/g,'<i>{$1}</i>')}</code>${m[3]?`<span class="api-body">${esc(m[3])}</span>`:""}</div>`;
  const h=t.match(/^([\w -]+):\s*(.+)$/);
  if(h&&!/[({]/.test(h[1]))return `<div class="api-note"><b>${esc(h[1])}</b>${h[2].split(/,\s*/).map(x=>`<code>${esc(x)}</code>`).join("")}</div>`;
  return `<div class="api-sig"><code>${esc(t)}</code></div>`}).join("");
 return box}
const editors=[];
async function renderCode(root){
 const blocks=[...root.querySelectorAll("pre code")].filter(c=>!c.classList.contains("language-mermaid"));
 if(!blocks.length)return;
 await monacoP;
 for(const e of editors)try{e.dispose()}catch(err){}
 editors.length=0;
 for(const c of blocks){
  const pre=c.parentNode,src=c.textContent.replace(/\n$/,"");
  const ls=src.split("\n").filter(l=>l.trim());
  if(ls.some(l=>API_RE.test(l.trim()))){pre.replaceWith(apiCard(ls));continue}
  const m=[...c.classList].find(x=>x.startsWith("language-"));
  const lang=m?m.slice(9):"plaintext";
  const box=document.createElement("div");box.className="codebox";
  const bar=document.createElement("div");bar.className="codebar";
  bar.innerHTML=`<span>${(LANGMAP[lang]||lang)}</span>`;
  const cbtn=document.createElement("button");cbtn.type="button";cbtn.textContent="Copy";
  cbtn.onclick=()=>{navigator.clipboard.writeText(src).then(()=>{cbtn.textContent="Copied";setTimeout(()=>cbtn.textContent="Copy",1200)})};
  bar.appendChild(cbtn);box.appendChild(bar);
  const host=document.createElement("div");host.className="codehost";box.appendChild(host);
  pre.replaceWith(box);
  const lines=src.split("\n").length;
  host.style.height=Math.min(560,Math.max(40,lines*19+16))+"px";
  const ed=monaco.editor.create(host,{value:src,language:LANGMAP[lang]||lang,readOnly:true,domReadOnly:true,
   theme:curTheme()==="dark"?"vs-dark":"vs",minimap:{enabled:false},scrollBeyondLastLine:false,fontSize:13,
   fontFamily:"JetBrains Mono, ui-monospace, monospace",lineNumbers:lines>3?"on":"off",renderLineHighlight:"none",
   automaticLayout:true,contextmenu:false,folding:lines>8,padding:{top:8,bottom:8},
   scrollbar:{alwaysConsumeMouseWheel:false,verticalScrollbarSize:8,horizontalScrollbarSize:8},overviewRulerLanes:0,
   guides:{indentation:false}});
  editors.push(ed);
 }
}
window.addEventListener("hashchange",show);
window.onTheme=show;
loadList().then(show);


function curTheme(){const a=document.documentElement.getAttribute("data-theme");return a||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}
function setBtn(){document.getElementById("themebtn").textContent=curTheme()==="dark"?"Light mode":"Dark mode"}
document.getElementById("themebtn").onclick=()=>{const t=curTheme()==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;
  try{localStorage.setItem("sc-theme",t)}catch(e){}
  if(window.mmInit)mmInit();
  setBtn();if(window.onTheme)onTheme()};
setBtn();document.getElementById("yr").textContent=new Date().getFullYear();
</script>
</body>
</html>
